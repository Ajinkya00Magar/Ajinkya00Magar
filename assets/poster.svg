<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="50%" stop-color="#121420" />
      <stop offset="100%" stop-color="#1b1626" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f093fb" />
      <stop offset="100%" stop-color="#f5576c" />
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#bg)" />

  <!-- Abstract Grid/Decorations -->
  <path d="M 0 100 L 800 100 M 0 200 L 800 200 M 0 300 L 800 300 M 0 400 L 800 400 M 0 500 L 800 500 M 0 600 L 800 600 M 0 700 L 800 700 M 0 800 L 800 800 M 0 900 L 800 900 M 0 1000 L 800 1000 M 0 1100 L 800 1100" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <path d="M 100 0 L 100 1200 M 200 0 L 200 1200 M 300 0 L 300 1200 M 400 0 L 400 1200 M 500 0 L 500 1200 M 600 0 L 600 1200 M 700 0 L 700 1200" stroke="rgba(255,255,255,0.03)" stroke-width="1" />

  <!-- Glowing Orbs -->
  <circle cx="150" cy="150" r="100" fill="url(#glow)" opacity="0.15" filter="url(#neonGlow)" />
  <circle cx="650" cy="850" r="150" fill="url(#accent)" opacity="0.1" filter="url(#neonGlow)" />
  <circle cx="700" cy="300" r="80" fill="url(#glow)" opacity="0.1" filter="url(#neonGlow)" />

  <!-- Header -->
  <text x="400" y="140" fill="#ffffff" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="900" text-anchor="middle" letter-spacing="4">AJINKYA MAGAR</text>
  <text x="400" y="190" fill="url(#glow)" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="2">SYSTEMS THAT LISTEN BEFORE THEY ACT</text>
  <rect x="350" y="220" width="100" height="4" fill="url(#accent)" rx="2" />

  <!-- About Section -->
  <text x="80" y="320" fill="#ffffff" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700">ABOUT ME</text>
  <rect x="80" y="340" width="640" height="130" fill="rgba(255,255,255,0.03)" rx="10" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <text x="110" y="380" fill="#a0a0b0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
    <tspan x="110" dy="0">🚀 Computer Engineering student at MIT Academy of Engineering.</tspan>
    <tspan x="110" dy="30">🧠 Working where AI, backend systems, computer networks, and products overlap.</tspan>
    <tspan x="110" dy="30">⚡ Fun fact: I want to know what happens after the demo. When things fail,</tspan>
    <tspan x="130" dy="25">I stay for the explanation.</tspan>
  </text>

  <!-- Tech Stack Section -->
  <text x="80" y="540" fill="#ffffff" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700">TECH STACK</text>
  
  <g transform="translate(80, 560)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="140" height="45" fill="rgba(0, 242, 254, 0.1)" rx="8" stroke="rgba(0, 242, 254, 0.3)" />
    <text x="70" y="28" fill="#00f2fe" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">PYTHON</text>

    <rect x="160" y="0" width="140" height="45" fill="rgba(245, 87, 108, 0.1)" rx="8" stroke="rgba(245, 87, 108, 0.3)" />
    <text x="230" y="28" fill="#f5576c" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">C / C++</text>

    <rect x="320" y="0" width="140" height="45" fill="rgba(79, 172, 254, 0.1)" rx="8" stroke="rgba(79, 172, 254, 0.3)" />
    <text x="390" y="28" fill="#4facfe" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">TYPESCRIPT</text>

    <rect x="480" y="0" width="140" height="45" fill="rgba(240, 147, 251, 0.1)" rx="8" stroke="rgba(240, 147, 251, 0.3)" />
    <text x="550" y="28" fill="#f093fb" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">NODE.JS</text>

    <!-- Row 2 -->
    <rect x="0" y="60" width="140" height="45" fill="rgba(255, 255, 255, 0.05)" rx="8" stroke="rgba(255, 255, 255, 0.2)" />
    <text x="70" y="88" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">LINUX</text>

    <rect x="160" y="60" width="140" height="45" fill="rgba(255, 255, 255, 0.05)" rx="8" stroke="rgba(255, 255, 255, 0.2)" />
    <text x="230" y="88" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">DOCKER</text>

    <rect x="320" y="60" width="140" height="45" fill="rgba(255, 255, 255, 0.05)" rx="8" stroke="rgba(255, 255, 255, 0.2)" />
    <text x="390" y="88" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">NETWORKING</text>

    <rect x="480" y="60" width="140" height="45" fill="rgba(255, 255, 255, 0.05)" rx="8" stroke="rgba(255, 255, 255, 0.2)" />
    <text x="550" y="88" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">GIT</text>
  </g>

  <!-- Projects Section -->
  <text x="80" y="740" fill="#ffffff" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700">TOP MISSIONS</text>
  
  <!-- Project 1 -->
  <rect x="80" y="760" width="310" height="120" fill="rgba(255,255,255,0.03)" rx="8" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <circle cx="105" cy="785" r="5" fill="#4facfe" />
  <text x="120" y="790" fill="#ffffff" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="bold">SYNAPSE</text>
  <text x="100" y="820" fill="#a0a0b0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
    <tspan x="100" dy="0">Hands-free voice control system</tspan>
    <tspan x="100" dy="20">through English, Hindi, and Marathi.</tspan>
  </text>

  <!-- Project 2 -->
  <rect x="410" y="760" width="310" height="120" fill="rgba(255,255,255,0.03)" rx="8" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <circle cx="435" cy="785" r="5" fill="#f5576c" />
  <text x="450" y="790" fill="#ffffff" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="bold">VIKRAM</text>
  <text x="430" y="820" fill="#a0a0b0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
    <tspan x="430" dy="0">Air-gapped predictive copilot for</tspan>
    <tspan x="430" dy="20">secure MPLS and SD-WAN ops.</tspan>
  </text>

  <!-- Project 3 -->
  <rect x="80" y="900" width="310" height="120" fill="rgba(255,255,255,0.03)" rx="8" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <circle cx="105" cy="925" r="5" fill="#f093fb" />
  <text x="120" y="930" fill="#ffffff" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="bold">FLOWMAP</text>
  <text x="100" y="960" fill="#a0a0b0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
    <tspan x="100" dy="0">Interactive learning map turning</tspan>
    <tspan x="100" dy="20">study paths into a visual journey.</tspan>
  </text>

  <!-- Project 4 -->
  <rect x="410" y="900" width="310" height="120" fill="rgba(255,255,255,0.03)" rx="8" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <circle cx="435" cy="925" r="5" fill="#00f2fe" />
  <text x="450" y="930" fill="#ffffff" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="bold">CAMPUS BUDDY</text>
  <text x="430" y="960" fill="#a0a0b0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
    <tspan x="430" dy="0">Real-time conversation and notices</tspan>
    <tspan x="430" dy="20">for a college community.</tspan>
  </text>

  <!-- Footer / Contact -->
  <rect x="250" y="1080" width="300" height="50" fill="url(#glow)" rx="25" />
  <text x="400" y="1111" fill="#000000" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">ajinkyamagarphys@gmail.com</text>

  <text x="400" y="1170" fill="rgba(255,255,255,0.3)" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">DESIGNED WITH 🚀 | END OF ROLL 00</text>
</svg>
