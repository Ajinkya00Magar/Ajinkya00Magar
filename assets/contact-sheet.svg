<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Ajinkya Magar — a profile in two exposures</title>
  <desc id="desc">A handmade contact-sheet title card transitioning from quiet sky blue to Spider-Man red, joined by a camera aperture.</desc>

  <defs>
    <linearGradient id="blueField" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9f1f5"/>
      <stop offset="1" stop-color="#277f9b"/>
    </linearGradient>
    <linearGradient id="redField" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef3340"/>
      <stop offset="1" stop-color="#70000e"/>
    </linearGradient>
    <linearGradient id="middleFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#071014" stop-opacity="0.16"/>
      <stop offset="0.48" stop-color="#080a0f" stop-opacity="0.94"/>
      <stop offset="0.52" stop-color="#080a0f" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#100509" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="perfs" width="72" height="18" patternUnits="userSpaceOnUse">
      <rect x="10" y="3" width="40" height="12" rx="4" fill="#f4f1e8"/>
    </pattern>
    <clipPath id="frame">
      <rect x="26" y="26" width="1228" height="368" rx="4"/>
    </clipPath>
  </defs>

  <rect width="1280" height="420" fill="#06080c"/>
  <rect x="18" y="12" width="1244" height="396" rx="8" fill="none" stroke="#47505a" stroke-width="2"/>
  <rect x="26" y="26" width="614" height="368" fill="url(#blueField)"/>
  <rect x="640" y="26" width="614" height="368" fill="url(#redField)"/>

  <g clip-path="url(#frame)">
    <rect x="26" y="26" width="1228" height="368" fill="url(#middleFade)"/>

    <!-- Loose petals: attention moving back toward other people. -->
    <g fill="#edfaff" opacity="0.78">
      <ellipse cx="118" cy="108" rx="4" ry="10" transform="rotate(-34 118 108)"/>
      <ellipse cx="210" cy="266" rx="5" ry="12" transform="rotate(49 210 266)"/>
      <ellipse cx="322" cy="91" rx="4" ry="9" transform="rotate(24 322 91)"/>
      <ellipse cx="414" cy="310" rx="5" ry="11" transform="rotate(-58 414 310)"/>
      <ellipse cx="520" cy="145" rx="4" ry="10" transform="rotate(38 520 145)"/>
    </g>
    <g fill="none" stroke="#e9fbff" stroke-width="1.5" opacity="0.28">
      <circle cx="130" cy="250" r="78"/>
      <circle cx="130" cy="250" r="54"/>
      <path d="M52 250h156M130 172v156"/>
    </g>

    <!-- Web geometry: ability extending outward as responsibility. -->
    <g fill="none" stroke="#12070a" stroke-width="2" opacity="0.48">
      <path d="M1160 58L826 364M1160 58L1000 394M1160 58L1240 270M1160 58L724 160"/>
      <path d="M1081 130Q1145 174 1210 170M992 211Q1096 277 1240 255M900 295Q1017 379 1140 394"/>
      <path d="M1051 157Q1080 101 1088 86M961 239Q1013 166 1027 138M873 319Q946 236 964 209"/>
    </g>

    <!-- Central aperture: the two ideas share one lens. -->
    <g transform="translate(640 210)">
      <circle r="91" fill="#07090d" stroke="#f4f1e8" stroke-width="2"/>
      <circle r="71" fill="none" stroke="#78848d" stroke-width="1"/>
      <g fill="#1c2329" stroke="#d5dde0" stroke-width="1">
        <path d="M0-67L36-48 24-7-17-4-37-40Z"/>
        <path d="M58-34L63 7 25 26-5-3 9-40Z"/>
        <path d="M58 34L22 58-9 30 6-9 46-17Z"/>
        <path d="M0 67L-36 48-24 7 17 4 37 40Z"/>
        <path d="M-58 34L-63-7-25-26 5 3-9 40Z"/>
        <path d="M-58-34L-22-58 9-30-6 9-46 17Z"/>
      </g>
      <circle r="19" fill="#f4f1e8"/>
      <circle r="8" fill="#090b0f"/>
    </g>
  </g>

  <rect x="26" y="26" width="1228" height="18" fill="url(#perfs)" opacity="0.82"/>
  <rect x="26" y="376" width="1228" height="18" fill="url(#perfs)" opacity="0.82"/>

  <g font-family="Consolas, 'Courier New', monospace" fill="#f8f7f2">
    <text x="58" y="75" font-size="14" letter-spacing="4">CONTACT SHEET / AM–00</text>
    <text x="1222" y="75" font-size="14" letter-spacing="4" text-anchor="end">MAHARASHTRA / INDIA</text>
    <text x="640" y="177" font-size="54" font-weight="700" letter-spacing="12" text-anchor="middle">AJINKYA</text>
    <text x="640" y="255" font-size="64" font-weight="700" letter-spacing="14" text-anchor="middle">MAGAR</text>
    <text x="640" y="291" font-size="13" letter-spacing="5" text-anchor="middle" fill="#cbd3d8">COMPUTER ENGINEERING · AI · SYSTEMS</text>
    <text x="58" y="354" font-size="15" letter-spacing="5">REPAIR / LISTEN</text>
    <text x="1222" y="354" font-size="15" letter-spacing="5" text-anchor="end">ACT / RESPONSIBILITY</text>
  </g>
</svg>
